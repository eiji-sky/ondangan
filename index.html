  }

  .wa-button:hover {

  }

  .wa-button svg {
    width: 22px;
    height: 22px;

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
